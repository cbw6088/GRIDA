<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>명함 — 그리다, 공간</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --white: #ffffff;
        --ink: #222222;
        --muted: #6b6b6b;
        --line: #d8d8d8;
        --sage: #8e9e94;
        --sand: #c6ba9e;
        --clay: #bca08a;
        --card-w: 92mm;
        --card-h: 52mm;
        --preview-scale: 1.72;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        font-family: "IBM Plex Sans KR", sans-serif;
        background: #1c1c1c;
        color: #e8e0d4;
        -webkit-font-smoothing: antialiased;
      }

      .studio {
        min-height: 100vh;
        padding: 40px 24px 72px;
      }

      .studio-bar {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        max-width: 1280px;
        margin: 0 auto 40px;
      }

      .studio-bar h1 {
        font-size: 15px;
        font-weight: 500;
        letter-spacing: 0.04em;
      }

      .studio-bar p {
        margin-top: 6px;
        font-size: 12px;
        font-weight: 300;
        color: #9a9188;
      }

      .print-btn {
        appearance: none;
        border: 1px solid #4a453f;
        background: transparent;
        color: #e8e0d4;
        padding: 9px 16px;
        font: inherit;
        font-size: 12px;
        letter-spacing: 0.08em;
        cursor: pointer;
      }

      .print-btn:hover {
        background: #e8e0d4;
        color: #161616;
      }

      .board {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 48px 52px;
        max-width: 1280px;
        margin: 0 auto;
      }

      .face {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .face figcaption {
        font-size: 11px;
        font-weight: 400;
        letter-spacing: 0.22em;
        color: #8a8278;
      }

      .stage {
        width: calc(var(--card-w) * var(--preview-scale));
        height: calc(var(--card-h) * var(--preview-scale));
      }

      .card {
        position: relative;
        width: var(--card-w);
        height: var(--card-h);
        overflow: hidden;
        background: var(--white);
        color: var(--ink);
        transform: scale(var(--preview-scale));
        transform-origin: top left;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
      }

      .front {
        background: #d8e0d6;
      }

      .card * {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      /* ——— 앞면 ——— */
      .front-lockup {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 3.2mm;
        z-index: 2;
      }

      .front-lockup .mark {
        width: 13.5mm;
        height: 13.5mm;
        object-fit: contain;
      }

      .front-lockup .copy {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 1.4mm;
      }

      .front-lockup .wordmark {
        height: 5.4mm;
        width: auto;
        display: block;
        object-fit: contain;
      }

      .front-lockup .slogan {
        font-size: 2.15mm;
        font-weight: 300;
        letter-spacing: 0.02em;
        color: var(--muted);
        white-space: nowrap;
      }

      /* ——— 뒷면 ——— */
      .back-brand {
        position: absolute;
        top: 6mm;
        left: 6.4mm;
        display: flex;
        align-items: center;
        gap: 2mm;
        z-index: 2;
      }

      .back-brand .mark {
        width: 7.4mm;
        height: 7.4mm;
        object-fit: contain;
      }

      .back-brand .copy {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 0.6mm;
      }

      .back-brand .wordmark {
        width: 20.5mm;
        height: 4.4mm;
        flex-shrink: 0;
        display: block;
        object-fit: contain;
        object-position: left center;
      }

      .back-brand .slogan {
        font-size: 1.75mm;
        font-weight: 300;
        letter-spacing: 0.02em;
        color: var(--muted);
        white-space: nowrap;
      }

      .back-main {
        position: absolute;
        top: 18.8mm;
        left: 6.6mm;
        z-index: 2;
      }

      .back-main .name {
        font-size: 5.2mm;
        font-weight: 600;
        letter-spacing: 0.28em;
        line-height: 1;
      }

      .contacts {
        margin-top: 2.5mm;
        display: flex;
        flex-direction: column;
        gap: 0.95mm;
      }

      .contacts a {
        display: flex;
        align-items: center;
        gap: 1.5mm;
        color: var(--ink);
        text-decoration: none;
        font-size: 2.25mm;
        font-weight: 400;
        letter-spacing: 0.01em;
        font-variant-numeric: tabular-nums;
      }

      .contacts svg {
        width: 2.4mm;
        height: 2.4mm;
        flex-shrink: 0;
        stroke: var(--ink);
        fill: none;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .foot {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 5.3mm;
        text-align: center;
        font-size: 2.05mm;
        font-weight: 400;
        letter-spacing: 0.04em;
        color: var(--muted);
        z-index: 2;
      }

      .accent {
        position: absolute;
        top: 6.6mm;
        right: 6.8mm;
        display: flex;
        align-items: center;
        gap: 1.6mm;
        z-index: 2;
      }

      .accent .dot {
        width: 1.15mm;
        height: 1.15mm;
        border-radius: 50%;
        background: var(--clay);
      }

      .accent .bar {
        width: 7mm;
        height: 0.18mm;
        background: var(--line);
      }

      .blooms {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        z-index: 0;
      }

      .bloom {
        position: absolute;
        border-radius: 50%;
        filter: blur(4.4mm);
      }

      .front .bloom-a {
        width: 36mm;
        height: 36mm;
        right: -13mm;
        top: -14mm;
        background: radial-gradient(
          circle,
          rgba(242, 208, 176, 0.28) 0%,
          rgba(242, 208, 176, 0) 70%
        );
      }

      .front .bloom-b {
        width: 26mm;
        height: 26mm;
        left: -9mm;
        bottom: -10mm;
        background: radial-gradient(
          circle,
          rgba(236, 188, 148, 0.22) 0%,
          rgba(236, 188, 148, 0) 70%
        );
      }

      .front .bloom-c {
        width: 16mm;
        height: 16mm;
        left: 21mm;
        top: 6mm;
        background: radial-gradient(
          circle,
          rgba(248, 224, 196, 0.24) 0%,
          rgba(248, 224, 196, 0) 70%
        );
      }

      .front .bloom-d {
        width: 12mm;
        height: 12mm;
        right: 15mm;
        bottom: 7mm;
        background: radial-gradient(
          circle,
          rgba(240, 200, 164, 0.2) 0%,
          rgba(240, 200, 164, 0) 70%
        );
      }

      .back .bloom-a {
        width: 30mm;
        height: 30mm;
        right: -8mm;
        top: 4mm;
        background: radial-gradient(
          circle,
          rgba(242, 208, 176, 0.24) 0%,
          rgba(242, 208, 176, 0) 70%
        );
      }

      .back .bloom-b {
        width: 18mm;
        height: 18mm;
        right: 1mm;
        bottom: 8mm;
        background: radial-gradient(
          circle,
          rgba(236, 188, 148, 0.18) 0%,
          rgba(236, 188, 148, 0) 70%
        );
      }

      .back .bloom-c {
        width: 14mm;
        height: 14mm;
        left: 27mm;
        top: -5mm;
        background: radial-gradient(
          circle,
          rgba(248, 224, 196, 0.2) 0%,
          rgba(248, 224, 196, 0) 70%
        );
      }

      .shapes {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 1;
      }

      .shapes .sq {
        position: absolute;
        border-radius: 0.6mm;
      }

      .back .sq-a {
        right: 10mm;
        top: 12mm;
        width: 11mm;
        height: 11mm;
        background: rgba(214, 176, 148, 0.2);
      }

      .back .sq-b {
        right: 5.2mm;
        top: 17.5mm;
        width: 8.2mm;
        height: 8.2mm;
        background: rgba(228, 196, 168, 0.24);
      }

      .back .sq-c {
        right: 12.5mm;
        top: 21.5mm;
        width: 5.4mm;
        height: 5.4mm;
        background: rgba(236, 214, 186, 0.28);
      }

      .waves {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 8.6mm;
        height: 4.4mm;
        z-index: 1;
      }

      .waves svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      .note {
        max-width: 1280px;
        margin: 48px auto 0;
        font-size: 12px;
        font-weight: 300;
        line-height: 1.7;
        color: #8a8278;
      }

      @media (max-width: 860px) {
        :root {
          --preview-scale: 1.55;
        }

        .studio-bar {
          flex-direction: column;
          align-items: flex-start;
        }
      }

      @media (max-width: 520px) {
        :root {
          --preview-scale: 1.15;
        }
      }

      @media print {
        @page {
          size: 92mm 52mm;
          margin: 0;
        }

        html,
        body,
        .studio {
          min-height: 0;
          height: auto;
          margin: 0;
          padding: 0;
          background: none;
        }

        .studio-bar,
        .face figcaption,
        .note {
          display: none !important;
        }

        .board {
          display: block;
          max-width: none;
          margin: 0;
        }

        .face {
          display: block;
          width: var(--card-w);
          height: var(--card-h);
          margin: 0;
          overflow: hidden;
          break-after: page;
          page-break-after: always;
        }

        .face:last-child {
          break-after: auto;
          page-break-after: auto;
        }

        .stage {
          width: var(--card-w);
          height: var(--card-h);
        }

        .card {
          transform: none;
          box-shadow: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="studio">
      <header class="studio-bar">
        <div>
          <h1>그리다, 공간 — 명함</h1>
          <p>92 × 52 mm · 앞면 / 뒷면</p>
        </div>
        <button class="print-btn" type="button" onclick="window.print()">
          인쇄하기
        </button>
      </header>

      <main class="board">
        <figure class="face">
          <figcaption>앞면</figcaption>
          <div class="stage">
            <article class="card front" aria-label="명함 앞면">
              <div class="blooms" aria-hidden="true">
                <span class="bloom bloom-a"></span>
                <span class="bloom bloom-b"></span>
                <span class="bloom bloom-c"></span>
                <span class="bloom bloom-d"></span>
              </div>
              <div class="front-lockup">
                <img
                  class="mark"
                  src="public/brand/logo.png"
                  alt=""
                  width="1024"
                  height="1024"
                />
                <div class="copy">
                  <img
                    class="wordmark"
                    src="public/brand/wordmark-ko.png"
                    alt="그리다, 공간"
                    width="807"
                    height="173"
                  />
                  <p class="slogan">공간을 그리고, 벽을 완성하다</p>
                </div>
              </div>
            </article>
          </div>
        </figure>

        <figure class="face">
          <figcaption>뒷면</figcaption>
          <div class="stage">
            <article class="card back" aria-label="명함 뒷면">
              <div class="blooms" aria-hidden="true">
                <span class="bloom bloom-a"></span>
                <span class="bloom bloom-b"></span>
                <span class="bloom bloom-c"></span>
              </div>
              <div class="shapes" aria-hidden="true">
                <span class="sq sq-a"></span>
                <span class="sq sq-b"></span>
                <span class="sq sq-c"></span>
              </div>
              <div class="waves" aria-hidden="true">
                <svg viewBox="0 0 320 24" preserveAspectRatio="none">
                  <path
                    d="M0 10 C28 2 52 18 80 10 C108 2 132 18 160 10 C188 2 212 18 240 10 C268 2 292 18 320 10"
                    stroke="#d2d2d2"
                    stroke-width="0.7"
                    fill="none"
                  />
                  <path
                    d="M0 16 C28 8 52 24 80 16 C108 8 132 24 160 16 C188 8 212 24 240 16 C268 8 292 24 320 16"
                    stroke="#d2d2d2"
                    stroke-width="0.7"
                    fill="none"
                  />
                </svg>
              </div>
              <div class="accent" aria-hidden="true">
                <span class="dot"></span>
                <span class="bar"></span>
              </div>
              <div class="back-brand">
                <img
                  class="mark"
                  src="public/brand/logo.png"
                  alt=""
                  width="1024"
                  height="1024"
                />
                <div class="copy">
                  <img
                    class="wordmark"
                    src="public/brand/wordmark-ko.png"
                    alt="그리다, 공간"
                    width="807"
                    height="173"
                  />
                  <p class="slogan">공간을 그리고, 벽을 완성하다</p>
                </div>
              </div>
              <div class="back-main">
                <p class="name">최 병 우</p>
                <p class="contacts">
                  <a href="tel:01041866088">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                      <path
                        d="M8.2 3.6h2.6l.9 3.6-2.1 1.2a11 11 0 0 0 5.6 5.6l1.2-2.1 3.6.9v2.6c0 .9-.8 1.7-1.7 1.6C9.2 17.6 6.4 14.8 5.6 5.3c-.1-.9.7-1.7 1.6-1.7Z"
                      />
                    </svg>
                    010-4186-6088
                  </a>
                  <a href="mailto:cbw60881@gmail.com">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                      <rect x="3.5" y="5.5" width="17" height="13" rx="1.4" />
                      <path d="m4.2 7 7.8 6.2L19.8 7" />
                    </svg>
                    cbw60881@gmail.com
                  </a>
                  <a href="https://grida-space.com/">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                      <circle cx="12" cy="12" r="8.2" />
                      <path d="M4 12h16" />
                      <path
                        d="M12 3.8c2.2 2.4 3.4 5.1 3.4 8.2s-1.2 5.8-3.4 8.2c-2.2-2.4-3.4-5.1-3.4-8.2s1.2-5.8 3.4-8.2Z"
                      />
                    </svg>
                    grida-space.com
                  </a>
                </p>
              </div>
              <p class="foot">도배 시공 전문 | 그리다, 공간</p>
            </article>
          </div>
        </figure>
      </main>

      <p class="note">
        화면에서는 확대해서 보여 줍니다. 인쇄 시 실제 명함 규격(92×52mm)으로
        나갑니다. 양면 인쇄할 때는 앞면을 먼저 출력한 뒤 용지를 뒤집어 뒷면을
        맞추면 됩니다.
      </p>
    </div>
  </body>
</html>
